[project]
name = "worktimecalc"
version = "1.1.0"
description = "Helper CLI for calculating leave & premium hour based on the start & end of the workday."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "sco1", email = "sco1.git@gmail.com"}
]

readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Private :: Do not Upload",
]

requires-python = ">=3.12"
dependencies = [
    "click~=8.0",
]

[project.urls]
Homepage = "https://github.com/sco1/"
Documentation = "https://github.com/sco1/worktimecalc/blob/main/README.md"
Repository = "https://github.com/sco1/worktimecalc.git"

[project.scripts]
worktimecalc = "worktimecalc:main"

[dependency-groups]
dev = [
    "black~=25.0",
    "flake8~=7.1",
    "flake8-annotations~=3.1",
    "flake8-define-class-attributes~=0.2",
    "isort~=7.0",
    "mypy~=1.14",
    "pre-commit~=4.0",
    "ruff~=0.9",
    "sco1-bumper~=2.0",
]

[tool.black]
line-length = 100

[tool.isort]
case_sensitive = true
known_first_party = "worktimecalc,tests"
no_lines_before = "LOCALFOLDER"
order_by_type = false
profile = "black"
line_length = 100

[tool.mypy]
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = "exhaustive-match"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.uv.build-backend]
module-name = "worktimecalc"
module-root = ""

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
